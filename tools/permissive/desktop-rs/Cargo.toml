[package]
name = "codex-permissive-desktop"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[[bin]]
name = "CodexPermissive"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# A separate debug-only UI test build. build.rs rejects this in release builds.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "zeroize"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
url = "2"
zeroize = "1"
rfd = "0.15"
arboard = { version = "3", default-features = false }
open = "5"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = false
strip = true
codegen-units = 16

[patch.crates-io]
# Windows crash upload opt-out is not exposed by Tauri's window builder.
wry = { path = "vendor/wry" }
